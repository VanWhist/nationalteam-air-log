<style>
html, body { margin: 0; padding: 0; background: #0B1420; min-height: 100%; }
* { box-sizing: border-box; }
input, textarea, select, button { font-family: inherit; }
input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.7); cursor: pointer; }

.app-shell { min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; color: #EAF1F8; }
.container { max-width: 480px; margin: 0 auto; padding: 32px 20px 96px; }

.draft-banner { border-radius: 10px; padding: 10px 12px; margin-bottom: 16px; background: #2A1F0E; border: 1px solid #6B4A1E; color: #FFB870; font-size: 11px; line-height: 1.6; }

.header-row { display: flex; align-items: center; justify-content: space-between; }
.refresh-btn { width: 28px; height: 28px; border-radius: 50%; border: 1px solid #6B4A1E; background: transparent; color: #FFB870; font-size: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
.refresh-btn:disabled { opacity: 0.6; cursor: default; }
@keyframes micSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.refresh-btn.spinning { animation: micSpin 0.8s linear infinite; }
.app-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
.app-tag { font-size: 11px; color: #5C7086; }
.app-logo { height: 40px; width: auto; border-radius: 4px; display: block; flex-shrink: 0; object-fit: contain; }
.divider-svg { width: 100%; height: 16px; display: block; margin-top: 4px; }

.tabs { display: flex; border-radius: 12px; padding: 4px; margin: 24px 0 16px; background: #131F30; border: 1px solid #26374E; }
.tab-btn { flex: 1; padding: 8px 0; border-radius: 8px; font-size: 14px; font-weight: 500; border: none; cursor: pointer; background: transparent; color: #8CA0B8; }
.tab-btn.active { background: #4CC3F0; color: #062230; }

.section { display: flex; flex-direction: column; gap: 18px; }
.field-label { font-size: 12px; margin-bottom: 6px; display: block; color: #5C7086; }
.sub-label { font-size: 10px; color: #5C7086; margin: 2px 0 6px; }

.chip-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.chip-grid.two { grid-template-columns: repeat(2, 1fr); }
.chip-grid.four { grid-template-columns: repeat(4, 1fr); }
.chip-btn { padding: 10px 4px; border-radius: 8px; font-size: 12px; font-weight: 600; text-align: center; line-height: 1.2; cursor: pointer; background: #1B2C42; color: #EAF1F8; border: 1px solid #26374E; }
.chip-btn.active { background: #4CC3F0; color: #062230; border-color: #4CC3F0; }
.chip-btn.amber.active { background: #FF9645; color: #23140A; border-color: #FF9645; }

.select-wrap { position: relative; }
.select-input { width: 100%; appearance: none; -webkit-appearance: none; border-radius: 8px; padding: 10px 32px 10px 12px; font-size: 14px; background: #1B2C42; border: 1px solid #26374E; color: #EAF1F8; outline: none; }
.select-chevron { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; }

.date-input, .text-input { width: 100%; border-radius: 8px; padding: 10px 12px; font-size: 14px; background: #1B2C42; border: 1px solid #26374E; color: #EAF1F8; outline: none; color-scheme: dark; }

.card { border-radius: 12px; padding: 14px; background: #131F30; border: 1px solid #26374E; }
.card.raised { background: #1B2C42; }

.tech-row-list { display: flex; flex-direction: column; gap: 10px; }
.tech-row { border-radius: 10px; padding: 12px; background: #1B2C42; border: 1px solid #26374E; display: flex; flex-direction: column; gap: 8px; }
.tech-row-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tech-row-idx { font-size: 11px; color: #5C7086; font-family: ui-monospace, monospace; }
.remove-btn { width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: #131F30; color: #5C7086; border: none; cursor: pointer; flex-shrink: 0; padding: 0; }
.code-badge { font-size: 10px; font-family: ui-monospace, monospace; color: #4CC3F0; background: #0B1420; border: 1px solid #2A5A75; border-radius: 6px; padding: 3px 6px; display: inline-block; }
.grab-note { font-size: 9px; color: #5C7086; margin-top: 2px; }
.inline-row { display: flex; align-items: center; gap: 8px; }
.num-field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
.num-field-label { font-size: 10px; color: #5C7086; }
.num-input { border-radius: 8px; padding: 9px 8px; font-size: 12px; font-family: ui-monospace, monospace; background: #131F30; border: 1px solid #26374E; color: #EAF1F8; outline: none; width: 100%; }

.add-row-btn { margin-top: 2px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 8px 12px; border-radius: 8px; background: #131F30; border: 1px dashed #26374E; color: #4CC3F0; cursor: pointer; }

.tech-row-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-shrink: 0; }
.icon-btn { width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: #131F30; color: #5C7086; border: none; cursor: pointer; flex-shrink: 0; padding: 0; }
.icon-btn.collapse-btn { color: #8CA0B8; }

.tech-row.collapsed { padding: 10px 12px; }
.tech-row-summary { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.tech-row-summary-main { font-size: 13px; font-weight: 600; color: #EAF1F8; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tech-row-summary-sub { font-size: 11px; color: #8CA0B8; flex-shrink: 0; }

.stepper { display: flex; align-items: center; gap: 6px; }
.stepper-btn { width: 34px; height: 34px; border-radius: 8px; background: #131F30; border: 1px solid #26374E; color: #4CC3F0; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; padding: 0; line-height: 1; }
.stepper .num-input { text-align: center; flex: 1; min-width: 0; }

.record-fixed-spacer { height: 74px; }
.record-fixed-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; gap: 8px; padding: 10px 20px calc(10px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(180deg, rgba(11,20,32,0) 0%, #0B1420 28%); }
.record-fixed-bar-inner { max-width: 480px; margin: 0 auto; width: 100%; display: flex; gap: 8px; }
.record-fixed-bar .add-row-btn { margin: 0; flex: 0 0 auto; white-space: nowrap; background: #1B2C42; }
.record-fixed-bar .save-btn { margin: 0; flex: 1; }

.note-textarea { width: 100%; border-radius: 8px; padding: 10px 12px; font-size: 14px; background: #1B2C42; border: 1px solid #26374E; color: #EAF1F8; outline: none; resize: none; }

.tech-note-toggle { margin-top: 6px; }
.tech-note-toggle a { color: #FFB870; font-size: 13px; text-decoration: none; }
.tech-note-row { margin-top: 6px; }
.tech-note-row .note-textarea { font-size: 13px; padding: 8px 10px; }
.tech-share-check { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12px; color: #8a94a6; }
.tech-share-check input[type="checkbox"] { width: 16px; height: 16px; }

.save-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 0; border-radius: 12px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; background: #4CC3F0; color: #062230; }
.save-btn.flash { background: #3FAE6A; }

.empty-card { border-radius: 12px; padding: 24px; text-align: center; font-size: 14px; background: #131F30; border: 1px solid #26374E; color: #5C7086; }

.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat-card { border-radius: 12px; padding: 14px; background: #131F30; border: 1px solid #26374E; }
.stat-label { font-size: 10px; color: #5C7086; margin-bottom: 4px; }
.stat-value { font-size: 18px; font-weight: 700; font-family: ui-monospace, monospace; }
.stat-sub { font-size: 10px; color: #5C7086; margin-top: 2px; }

.chart-card { border-radius: 12px; padding: 16px; background: #131F30; border: 1px solid #26374E; }
.chart-title { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; font-size: 12px; color: #5C7086; }
.legend-row { display: flex; gap: 16px; margin-top: 8px; font-size: 11px; }

.rank-list { display: flex; flex-direction: column; gap: 8px; }
.rank-item { display: flex; align-items: center; gap: 10px; }
.rank-name { font-size: 12px; width: 108px; flex-shrink: 0; color: #EAF1F8; }
.rank-bar-wrap { flex: 1; height: 10px; border-radius: 5px; background: #1B2C42; overflow: hidden; }
.rank-bar { height: 100%; background: #4CC3F0; border-radius: 5px; }
.rank-count { font-size: 11px; width: 64px; text-align: right; flex-shrink: 0; color: #8CA0B8; font-family: ui-monospace, monospace; } .rank-count-cap { display: block; font-size: 9px; color: #5C7086; font-weight: 400; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }

.recent-title { font-size: 12px; margin-bottom: 8px; color: #5C7086; }
.recent-list { display: flex; flex-direction: column; gap: 8px; }
.recent-item { border-radius: 8px; padding: 10px 12px; background: #131F30; border: 1px solid #26374E; }
.recent-date { font-size: 12px; font-family: ui-monospace, monospace; color: #8CA0B8; }
.recent-meta { font-size: 10px; color: #5C7086; margin-top: 2px; }
.recent-techs { font-size: 13px; margin-top: 4px; display: flex; flex-direction: column; gap: 6px; }

<body>
<div id="root"></div>

<script>
/* =========================================================
NTエアログ / ナショナルチーム版。
記録はGoogleスプレッドシート(Apps Script Web App経由)に保存され、
同じアプリを開いている全員で共有されます。
========================================================= */

var COLORS = {
ice: "#4CC3F0",
amber: "#FF9645",
textFaint: "#5C7086",
};

/* ---- Googleスプレッドシート連携(Apps Script Web App) ---- */
var API_URL = "https://script.google.com/macros/s/AKfycbwhxPSdRvM67Bf7RO6gDUoZxxvGipDNGs7Up5BXUvbqulr90wjGzhZXtV2VQERyP3rAYw/exec";

function apiGet() {
return fetch(API_URL).then(function (res) { return res.json(); });
}
function apiPost(payload) {
return fetch(API_URL, {
method: "POST",
headers: { "Content-Type": "text/plain;charset=utf-8" },
body: JSON.stringify(payload),
}).then(function (res) { return res.json(); });
}
function refreshData() {
return apiGet().then(function (data) {
ATHLETES = (data.athletes || []).map(function (a) { return { id: a.id, name: a.name }; });
DATA = data.records || [];
VIDEOS = data.videos || [];
recentAthleteIds = computeRecentAthleteIds();
if (!S.athlete && ATHLETES.length) { S.athlete = getOrderedAthletes()[0].id; }
});
}
/* サーバー確認済みの動画(VIDEOS)を行(rowId)単位で検索する。rowId/typeが記録されている
新形式の動画だけが対象で、rowIdが空の古い(v1時代の)動画はここには出てこない
(それらは entryId 単位で集約する videosForEntry() 経由でギャラリーカードにのみ表示する)。 */function manualRefresh() {
if (S.refreshing) return;
S.refreshing = true;
S.refreshError = "";
render();
refreshData().then(function () {
S.refreshing = false;
render();
}).catch(function (err) {
S.refreshing = false;
S.refreshError = "更新に失敗しました";
render();
});
}

function videosForRow(entryId, rowId, type) {
if (!rowId) return [];
return VIDEOS.filter(function (v) { return v.entryId === entryId && v.rowId === rowId && v.type === type; });
}
/* エントリ内の全動画(新形式・旧形式どちらも)を集約する。ギャラリーカード表示用。 */
function videosForEntry(entryId) {
return VIDEOS.filter(function (v) { return v.entryId === entryId; });
}

/* ---- 動画アップロード(Dropbox連携、Apps Script経由のチャンクアップロード) ----
記録時に選んだ動画は「保存後に送信」のローカルプレビューとして保持し、記録の保存(saveEntry)が
成功した後にバックグラウンドで順番にアップロードする。ダッシュボードから直接追加した動画は
選択直後にアップロードを開始する。どちらも同じキュー(videoQueue)・同じアップロード関数
(uploadVideoFile)・同じ保留中トラッカー(pendingVideos)を使う。 */
var VIDEO_CHUNK_SIZE = 4 * 1024 * 1024; // 4MB
var VIDEO_MAX_SIZE = 500 * 1024 * 1024; // 500MB

function videoListField(type) {
if (type === "single") return "videos";
if (type === "success") return "successVideos";
return "failVideos";
}
function videoCap(row, type) {
var raw = type === "single" ? row.reps : (type === "success" ? row.success : row.fail);
if (raw === "" || raw === undefined || raw === null) return Infinity;
return Math.max(0, Number(raw) || 0);
}
function videoCapLabel(count, cap) { return cap === Infinity ? (count + "本") : (count + "/" + cap); }
var videoItemCounter = 0;
function nextVideoItemId() { videoItemCounter++; return "vi" + videoItemCounter + "_" + Date.now().toString(36); }
function genRowId() { return "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

/* ---- サーバーにまだ存在しない(アップロード中/待機中/エラー)動画のローカル追跡。
key は entryId+"|"+rowId+"|"+type。アップロードが完了しrefreshData()でVIDEOSに反映されたら
該当アイテムをここから取り除く。 */
var pendingVideos = {};
function pendingKey(entryId, rowId, type) { return entryId + "|" + rowId + "|" + type; }
function pendingListFor(entryId, rowId, type) { return pendingVideos[pendingKey(entryId, rowId, type)] || []; }
function addPendingItems(entryId, rowId, type, items) {
var key = pendingKey(entryId, rowId, type);
pendingVideos[key] = (pendingVideos[key] || []).concat(items);
}
function removePendingItem(entryId, rowId, type, itemId) {
var key = pendingKey(entryId, rowId, type);
if (!pendingVideos[key]) return;
pendingVideos[key] = pendingVideos[key].filter(function (v) { return v.id !== itemId; });
if (!pendingVideos[key].length) delete pendingVideos[key];
}

var videoQueue = [];
var videoQueueTotal = 0;
var videoQueueRunning = false;
function enqueueVideoUploads(items) {
if (!items || !items.length) return;
videoQueue = videoQueue.concat(items);
videoQueueTotal += items.length;
S.bgUpload = { total: videoQueueTotal, done: videoQueueTotal - videoQueue.length };
render();
if (!videoQueueRunning) runVideoQueue();
}
function runVideoQueue() {
if (!videoQueue.length) {
videoQueueRunning = false;
videoQueueTotal = 0;
S.bgUpload = null;
render();
return;
}
videoQueueRunning = true;
var item = videoQueue.shift();
runQueueItem(item, function () {
S.bgUpload = { total: videoQueueTotal, done: videoQueueTotal - videoQueue.length };
render();
runVideoQueue();
});
}
function runQueueItem(item, done) {
if (!item.file) { done(); return; }
item.status = "uploading";
item.progress = 0;
render();
uploadVideoFile(item.file, item.entryId, item.rowId, item.trickId, item.type, item.athleteId, item.date, item.trickLabel, function (pct) {
item.progress = pct;
render();
}).then(function () {
item.status = "done";
item.progress = 100;
item.file = null;
return refreshData();
}).then(function () {
removePendingItem(item.entryId, item.rowId, item.type, item.id);
render();
done();
}).catch(function (err) {
item.status = "error";
item.progress = 0;
render();
done();
});
}
function retryQueueItem(entryId, rowId, type, itemId) {
var list = pendingListFor(entryId, rowId, type);
var item = list.filter(function (v) { return v.id === itemId; })[0];
if (!item || !item.file) return;
enqueueVideoUploads([item]);
}

function readFileSlice(file, start, end) {
return new Promise(function (resolve, reject) {
var reader = new FileReader();
reader.onload = function () {
var result = String(reader.result || "");
resolve(result.split(",")[1] || "");
};
reader.onerror = function () { reject(reader.error); };
reader.readAsDataURL(file.slice(start, end));
});
}

function uploadVideoFile(file, entryId, rowId, trickId, type, athleteId, date, trickLabel, onProgress) {
var totalSize = file.size;
var sessionId = null;
var offset = 0;

function uploadNext(index) {
var start = index * VIDEO_CHUNK_SIZE;
var end = Math.min(start + VIDEO_CHUNK_SIZE, totalSize);
var isLast = end >= totalSize;
return readFileSlice(file, start, end).then(function (base64) {
if (isLast) {
return apiPost({
type: "videoUploadFinish",
sessionId: sessionId,
offset: offset,
chunkBase64: base64,
entryId: entryId,
rowId: rowId || "",
trickId: trickId,
videoType: type || "",
athleteId: athleteId || "",
athleteName: athleteName(athleteId) || "",
fileName: file.name || "video.mp4",
date: date || "",
trickLabel: trickLabel || "",
}).then(function (finishRes) {
if (!finishRes || finishRes.status !== "ok") throw new Error("upload finish failed");
if (onProgress) onProgress(100);
return finishRes;
});
}
return apiPost({
type: "videoUploadChunk",
sessionId: sessionId,
offset: offset,
chunkBase64: base64,
}).then(function (chunkRes) {
if (!chunkRes || chunkRes.status !== "ok") throw new Error("upload chunk failed");
offset += end - start;
if (onProgress) onProgress(Math.min(99, Math.round((offset / totalSize) * 100)));
return uploadNext(index + 1);
});
});
}

if (file.size > VIDEO_MAX_SIZE) {
return Promise.reject(new Error("動画サイズが大きすぎます(上限" + Math.round(VIDEO_MAX_SIZE / (1024 * 1024)) + "MB)。"));
}
return apiPost({ type: "videoUploadStart" }).then(function (startRes) {
if (!startRes || startRes.status !== "ok" || !startRes.sessionId) throw new Error("upload start failed");
sessionId = startRes.sessionId;
return uploadNext(0);
});
}

/* ---- 記録タブ:保存前のローカルプレビュー選択 ---- */
function handleVideoFileChange(idx, type, inputEl) {
var files = inputEl.files;
if (!files || !files.length) return;
var row = S.rows[idx];
var listField = videoListField(type);
if (!row[listField]) row[listField] = [];
var cap = videoCap(row, type);
for (var i = 0; i < files.length; i++) {
if (row[listField].length >= cap) break;
var file = files[i];
row[listField].push({ id: nextVideoItemId(), name: file.name, url: URL.createObjectURL(file), status: "pending", progress: 0, file: file });
}
inputEl.value = "";
render();
}
function removeVideoFile(idx, type, itemId) {
var row = S.rows[idx];
var listField = videoListField(type);
var list = row[listField] || [];
var item = list.filter(function (v) { return v.id === itemId; })[0];
if (item && item.url) { try { URL.revokeObjectURL(item.url); } catch (err) {} }
row[listField] = list.filter(function (v) { return v.id !== itemId; });
render();
}

/* ---- ダッシュボード:既存の記録に動画を追加(選択直後にアップロード開始) ----
rowIdx(そのentry.rows内でのインデックス)で対象行を特定する。行にまだrowIdが無い場合
(v1時代に作成された記録)は、動画を紐付けられるようupdateEntry_で新しいrowIdを1つだけ
書き戻してから(他の行のrowIdはそのまま)アップロードを開始する。 */
function dashVideoInputId(entryId, rowIdx, type) { return "dash-vid-" + entryId + "-" + rowIdx + "-" + type; }
function ensureRowId(entry, rowIdx) {
var row = entry.rows[rowIdx];
if (row.rowId) return Promise.resolve(row.rowId);
var newRowId = genRowId();
var rows = entry.rows.map(function (r, i) {
var out = { rowId: i === rowIdx ? newRowId : (r.rowId || undefined), trickId: r.trickId, trickLabel: trickLabel(r.trickId), modifier: r.modifier, nuki: !!r.nuki, unnatural: !!r.unnatural };
if (entry.category === "trampoline") { out.reps = r.reps; out.kakari = !!r.kakari; out.airtimeSeconds = r.airtimeSeconds; } else { out.success = r.success; out.fail = r.fail; out.reps = r.reps; out.result = r.result; out.grabCategory = r.grabCategory; out.grabType = r.grabType; out.near = r.near; out.wobbleDetail = r.wobbleDetail; }
return out;
});
return apiPost({ type: "updateEntry", entryId: entry.id, athlete: entry.athlete, athleteName: entry.athleteName, category: entry.category, date: entry.date, facility: entry.facility, kicker: entry.kicker, note: entry.note, rows: rows }).then(function (res) {
if (!res || res.status !== "ok") throw new Error("rowId backfill failed");
return refreshData();
}).then(function () { return newRowId; });
}
function handleDashVideoFileChange(entryId, rowIdx, type, inputEl) {
var files = inputEl.files;
if (!files || !files.length) return;
var entry = DATA.filter(function (e) { return e.id === entryId; })[0];
if (!entry || !entry.rows[rowIdx]) { inputEl.value = ""; return; }
var trickId = entry.rows[rowIdx].trickId;
var fileList = [];
for (var i = 0; i < files.length; i++) fileList.push(files[i]);
inputEl.value = "";

function getEntries(athleteId, category) {

function rowTotal(r) { return r.reps !== undefined ? Number(r.reps) || 0 : (Number(r.success) || 0) + (Number(r.fail) || 0); }
function rowSuccess(r) {
if (r.reps === undefined) return Number(r.success) || 0; // 旧データ(reps列なし)はそのまま成功数を返す
if (r.result === "success") return Number(r.reps) || 0;
if (r.result === "fail") return 0;
return null; // ヨレ・未選択・トランポリンは成功率計算に含めない
}
function entryTotal(entry) {
return entry.rows.reduce(function (sum, r) { return sum + rowTotal(r); }, 0);
}
function entrySuccess(entry) {
return entry.rows.reduce(function (sum, r) { var s = rowSuccess(r); return sum + (s === null ? 0 : s); }, 0);
}
function trickTotals(entries) {
var map = {};
entries.forEach(function (e) {
e.rows.forEach(function (r) {
var key = trickLabel(r.trickId) + (r.nuki ? "（抜き）" : "") + (r.unnatural ? "（アンナチュラル）" : "");
if (!map[key]) map[key] = { count: 0, success: 0, kakari: 0, speed: {}, lastDate: null };
map[key].count += rowTotal(r);
var s = rowSuccess(r);
if (s !== null) map[key].success += s;
if (r.kakari) map[key].kakari += 1;
if (!map[key].lastDate || e.date > map[key].lastDate) map[key].lastDate = e.date;
if (r.speedLevel) {
if (!map[key].speed[r.speedLevel]) map[key].speed[r.speedLevel] = { success: 0, fail: 0, yure: 0, yureLow: 0, yureHigh: 0 };
var sd = map[key].speed[r.speedLevel];
if (r.reps === undefined) {
// 旧データ(reps列なし)は成功/失敗の集計をそのまま使う
sd.success += Number(r.success) || 0;
sd.fail += Number(r.fail) || 0;
} else {
var repsForSpeed = Number(r.reps) || 0;
if (r.result === "success") {
sd.success += repsForSpeed;
} else if (r.result === "fail") {
sd.fail += repsForSpeed;
} else if (r.result === "yure") {
sd.yure += repsForSpeed;
var maxSeverity = (r.wobbleDetail || []).reduce(function (m, w) { return Math.max(m, Number(w.severity) || 0); }, 0);
if (maxSeverity >= 3) sd.yureHigh += repsForSpeed;
else if (maxSeverity >= 1) sd.yureLow += repsForSpeed;
}
// result === "" (未選択) はスピード別の成功率/ヨレ率の集計には含めない
}
}
});
});
return Object.keys(map).map(function (k) { return { name: k, count: map[k].count, success: map[k].success, kakari: map[k].kakari, speed: map[k].speed, lastDate: map[k].lastDate }; }).sort(function (a, b) { return b.count - a.count; });
}
function speedTotalsAggregate(totals) {

function computeChartGeom(data, series, width, height, m) {
var n = data.length;
var plotW = width - m.left - m.right;
var plotH = height - m.top - m.bottom;
var values = [];
data.forEach(function (d) { series.forEach(function (s) { var v = d[s.key]; if (v !== null && v !== undefined && !Number.isNaN(v)) values.push(v); }); });
var maxV = values.length ? Math.max.apply(null, values) : 1;
var minV = values.length ? Math.min(0, Math.min.apply(null, values)) : 0;
var range = maxV - minV || 1;
function xAt(i) { return n <= 1 ? m.left + plotW / 2 : m.left + (i / (n - 1)) * plotW; }
function yAt(v) { return m.top + plotH - ((v - minV) / range) * plotH; }
return { xAt: xAt, yAt: yAt, maxV: maxV, minV: minV, n: n, plotW: plotW, plotH: plotH };
}
function renderChartHtml(id, data, series, height) {
var width = 400;
var m = { top: 10, bottom: 20, left: 30, right: 8 };
var geom = computeChartGeom(data, series, width, height, m);
var n = data.length;
var svg = '<svg viewBox="0 0 ' + width + " " + height + '" width="100%" height="' + height + '" preserveAspectRatio="none" style="display:block;overflow:visible;">';

});
});
return { order: order, map: map };
}
function sumTrickCounts(tricks) {

r.grabCategory = "grab";
r.grabType = grabId;
r.modifier = deriveModifier(r.grabCategory, r.grabType);
render();
}
function setEditRowNear(idx, v) { var r = S.editDraft.rows[idx]; r.near = (r.near === v ? null : v); render(); }
function openEditGrabModal(idx) { S.grabModalEditRowIdx = idx; render(); }
function closeEditGrabModal() { S.grabModalEditRowIdx = null; render(); }
function setEditRowResult(idx, v) { var r = S.editDraft.rows[idx]; r.result = (r.result === v ? "" : v); render(); }
function toggleEditRowWobbleTag(idx, tag) {
var r = S.editDraft.rows[idx];
r.wobbleDetail = r.wobbleDetail || [];
var i = r.wobbleDetail.findIndex(function (w) { return w.tag === tag; });
if (i >= 0) { r.wobbleDetail.splice(i, 1); } else { r.wobbleDetail.push({ tag: tag, severity: 3 }); }
render();
}
function setEditRowWobbleSeverity(idx, tag, severity) {
var r = S.editDraft.rows[idx];
var w = (r.wobbleDetail || []).filter(function (w) { return w.tag === tag; })[0];
if (w) { w.severity = severity; render(); }
}

function saveEditEntry(category) {
var entry = DATA.filter(function (x) { return x.id === S.editingEntryId; })[0];
if (!entry) return;
var validRows;
if (category === "trampoline") {
validRows = S.editDraft.rows.filter(function (r) { if (r.trickId === "airtime") { return r.airtimeSeconds !== "" && r.airtimeSeconds !== undefined && Number(r.airtimeSeconds) >= 0; } return r.reps !== "" && r.reps !== undefined && Number(r.reps) >= 0; }).map(function (r) {
return { rowId: r.rowId || genRowId(), trickId: r.trickId, trickLabel: trickLabel(r.trickId), modifier: r.modifier, nuki: !!r.nuki, unnatural: !!r.unnatural, kakari: !!r.kakari, reps: r.trickId === "airtime" ? 10 : (Number(r.reps) || 0), airtimeSeconds: r.trickId === "airtime" ? (Number(r.airtimeSeconds) || 0) : '', note: (r.note || "").trim() };
});
} else {
validRows = S.editDraft.rows.filter(function (r) {
return (r.reps !== "" && r.reps !== undefined) || !!r.result || (r.grabCategory && r.grabCategory !== "none") || (r.wobbleDetail && r.wobbleDetail.length > 0) || !!r.nuki || !!r.unnatural || ((r.note || "").trim() !== "") || (r.success !== "" && r.success !== undefined && Number(r.success) >= 0) || (r.fail !== "" && r.fail !== undefined && Number(r.fail) >= 0);
}).map(function (r) {
var repsNum = (r.reps !== "" && r.reps !== undefined) ? (Number(r.reps) || 0) : 0;
var successOut = r.result === "success" ? repsNum : (r.result ? 0 : Number(r.success) || 0);
var failOut = r.result === "fail" ? repsNum : (r.result ? 0 : Number(r.fail) || 0);
return { rowId: r.rowId || genRowId(), trickId: r.trickId, trickLabel: trickLabel(r.trickId), modifier: r.modifier, nuki: !!r.nuki, unnatural: !!r.unnatural, reps: repsNum, result: r.result || "", grabType: r.grabCategory === "grab" ? (r.grabType || "") : "", near: r.near || "", wobbleDetail: r.wobbleDetail || [], success: successOut, fail: failOut, speedLevel: r.speedLevel || "normal", note: (r.note || "").trim() };
});
}
if (validRows.length === 0) return;
S.editSaving = true;
S.editError = "";
render();
var payload = {
type: "updateEntry",
entryId: entry.id,
athlete: entry.athlete,
athleteName: entry.athleteName || athleteName(entry.athlete),
category: category,
date: S.editDraft.date,
note: S.editDraft.note.trim(),
rows: validRows,
};
if (category === "water") { payload.facility = S.editDraft.facility; payload.kicker = S.editDraft.kicker; }
apiPost(payload).then(function (result) {
if (result.status !== "ok") { throw new Error(result.message || "更新に失敗しました"); }
return refreshData();
}).then(function () {
S.editingEntryId = null;
S.editDraft = null;
S.editSaving = false;
render();
}).catch(function (err) {
S.editSaving = false;
S.editError = "保存に失敗しました。通信状況を確認してもう一度お試しください。";
render();
});
}
function requestDeleteEntry(id) { S.confirmDeleteId = id; S.deleteError = ""; render(); }
function cancelDeleteEntry() { S.confirmDeleteId = null; S.deleteError = ""; render(); }
function confirmDeleteEntry(id) {
S.deleteBusy = true;
S.deleteError = "";
render();
apiPost({ type: "deleteEntry", entryId: id }).then(function (result) {
if (result.status !== "ok") { throw new Error(result.message || "削除に失敗しました"); }
return refreshData();
}).then(function () {
if (S.editingEntryId === id) S.editingEntryId = null;
S.editDraft = null;
S.confirmDeleteId = null;
S.deleteBusy = false;
render();
}).catch(function (err) {
S.deleteBusy = false;
S.deleteError = "削除に失敗しました。通信状況を確認してもう一度お試しください。";
render();
});
}

function toggleEditRowNoteOpen(idx) { S.editDraft.rows[idx]._noteOpen = !S.editDraft.rows[idx]._noteOpen; render(); }
function renderEditTechRowNoteHtml(row, idx) {
var noteOpen = row._noteOpen || (row.note && row.note.trim());
if (!noteOpen) { return '<div class="tech-note-toggle"><a href="javascript:void(0)" onclick="toggleEditRowNoteOpen(' + idx + ')">+ メモ</a></div>'; }
return '<div class="tech-note-row"><textarea class="note-textarea tech-note-input" rows="2" placeholder="この技のメモ" oninput="setEditRowField(' + idx + ",'note',this.value)\" onblur=\"render()\">" + escHtml(row.note || '') + "</textarea></div>";
}

var isTrampoline = category === "trampoline";
var countFields = '<div class="num-field"><span class="num-field-label">本数</span><input class="num-input" type="number" inputmode="numeric" placeholder="0" value="' + escAttr(row.reps) + '" oninput="setEditRowField(' + idx + ",'reps',this.value)\"></div>";
var modifierChips = isTrampoline ? MODIFIERS.map(function (m) {
var isGrabLetter = m.id === "G" || m.id === "g";
return '<button class="chip-btn ' + (isGrabLetter ? "amber " : "") + (row.modifier === m.id ? "active" : "") + '" style="flex:1;font-size:10px;padding:8px 3px;" onclick="setEditRowModifier(' + idx + ",'" + m.id + "')\">" + escHtml(m.label) + "</button>";
}).join("") : renderGrabCategoryChipsHtml(idx, row, "setEditRowGrabCategory");
var nukiChip = '<button class="chip-btn ' + (row.nuki ? "active" : "") + '" style="flex:1;font-size:10px;padding:8px 3px;" onclick="toggleEditRowNuki(' + idx + ')">抜き</button>';
var unnaturalChip = '<button class="chip-btn ' + (row.unnatural ? "active" : "") + '" style="flex:1;font-size:10px;padding:8px 3px;" onclick="toggleEditRowUnnatural(' + idx + ')">アンナチュラル</button>';
var optgroups = TRICKS.filter(function (g) { return g.group !== "エアタイム" || category === "trampoline"; }).map(function (g) {
var opts = g.items.filter(function (t) { return !t.trampolineOnly || category === "trampoline"; }).map(function (t) {
return '<option value="' + t.id + '" ' + (row.trickId === t.id ? "selected" : "") + ">" + escHtml(t.label) + (t.code ? " (" + t.code + ")" : "") + "</option>";
}).join("");
return '<optgroup label="' + escAttr(g.group) + '">' + opts + "</optgroup>";
}).join("");
var trickSelect = '<div class="select-wrap"><select class="select-input" onchange="setEditRowTrick(' + idx + ',this.value)">' + optgroups + "</select>" +
'<span class="select-chevron">' + iconChevronDown(16, COLORS.textFaint) + "</span></div>";
return (
'<div class="tech-row">' +
'<div class="tech-row-top"><span class="tech-row-idx">技 ' + (idx + 1) + "</span>" +
(code ? '<span class="code-badge">' + escHtml(code) + "</span>" : "") +
(!isTrampoline && row.grabCategory === "grab" && row.grabType === "other" ? '<span class="code-badge">グラブ(その他)</span>' : "") +
(row.nuki ? '<span class="code-badge" style="color:' + COLORS.amber + ';border-color:' + COLORS.amber + ';">抜き</span>' : "") +
(row.unnatural ? '<span class="code-badge" style="color:' + COLORS.ice + ';border-color:' + COLORS.ice + ';">アンナチュラル</span>' : "") +
'<button class="remove-btn" onclick="removeEditRow(' + idx + ')" style="margin-left:auto;">' + iconMinus(14, COLORS.textFaint) + "</button>" +
"</div>" +
trickSelect +
(isTrampoline ? '<div class="inline-row">' + modifierChips + "</div>" : '<div class="sub-label">グラブ・ポジション</div><div class="inline-row">' + modifierChips + "</div>" + renderGrabPickerHtml(idx, row, "setEditRowGrab", "setEditRowNear", "openEditGrabModal")) +
'<div class="inline-row">' + nukiChip + unnaturalChip + "</div>" +
'<div class="inline-row">' + countFields + "</div>" +
(isTrampoline ? "" : ('<div class="sub-label" style="margin-top:8px;">結果（任意）</div><div class="inline-row">' + renderResultChipsHtml(idx, row, "setEditRowResult") + "</div>" + renderYurePanelHtml(idx, row, "toggleEditRowWobbleTag", "setEditRowWobbleSeverity"))) +
(isTrampoline ? "" : renderSpeedSelectHtml(idx, row, "setEditRowSpeed")) +
(function () {
var rowId = row.rowId || "";
var n = videosForRow(entryId, rowId, "single").length + pendingListFor(entryId, rowId, "single").length;
return n ? '<div class="sub-label">🎬 動画(' + n + '本)が添付されています(追加・削除は「ダッシュボード」の記録から行えます)</div>' : "";

"</div>"
);

function renderFeedbackCard() {
if (!S.feedbackOpen) { return ""; }
if (S.feedbackSent) {
return '<div class="card" style="margin-top:8px;border-color:' + COLORS.ice + ';display:flex;flex-direction:column;gap:8px;"><div style="font-size:13px;">送信しました。ありがとうございます！</div><button class="chip-btn" style="align-self:flex-start;" onclick="toggleFeedback()">閉じる</button></div>';
}
var busy = S.feedbackSending;
return (
'<div class="card" style="margin-top:8px;display:flex;flex-direction:column;gap:10px;">' +
'<div style="font-size:13px;font-weight:600;">フィードバックを送る</div>' +
'<div class="chip-grid">' +
'<button class="chip-btn ' + (S.feedbackType === "bug" ? "active" : "") + '" onclick="setFeedbackType(\'bug\')" ' + (busy ? "disabled" : "") + '>バグ報告</button>' +
'<button class="chip-btn ' + (S.feedbackType === "request" ? "active" : "") + '" onclick="setFeedbackType(\'request\')" ' + (busy ? "disabled" : "") + '>機能要望</button>' +
'<button class="chip-btn ' + (S.feedbackType === "other" ? "active" : "") + '" onclick="setFeedbackType(\'other\')" ' + (busy ? "disabled" : "") + '>その他</button>' +
"</div>" +
'<textarea class="note-textarea" rows="3" placeholder="内容を入力してください" oninput="setFeedbackContent(this.value)" ' + (busy ? "disabled" : "") + '>' + escHtml(S.feedbackContent) + "</textarea>" +
'<input class="text-input" type="text" placeholder="お名前(任意)" value="' + escAttr(S.feedbackName) + '" oninput="setFeedbackName(this.value)" ' + (busy ? "disabled" : "") + '>' +
'<div class="inline-row">' +
'<button class="save-btn" style="flex:1;" onclick="sendFeedback()" ' + (busy ? "disabled" : "") + '>' + (busy ? "送信中…" : "送信する") + '</button>' +
'<button class="chip-btn" style="flex:0 0 auto;padding:12px 14px;" onclick="toggleFeedback()" ' + (busy ? "disabled" : "") + '>キャンセル</button>' +
"</div>" +
(S.feedbackError ? '<div style="color:' + COLORS.amber + ';font-size:12px;">' + escHtml(S.feedbackError) + "</div>" : "") +
"</div>"
);
}
function renderTabs() {
return (
'<div class="tabs">' +
'<button class="tab-btn ' + (S.tab === "record" ? "active" : "") + '" onclick="selectTab(\'record\')">記録する</button>' +
'<button class="tab-btn ' + (S.tab === "dashboard" ? "active" : "") + '" onclick="selectTab(\'dashboard\')">ダッシュボード</button>' +
"</div>"
);
}
function renderVideoModal() {
var open = !!S.videoModalUrl;
return (
'<div class="video-modal-overlay' + (open ? " open" : "") + '" onclick="closeVideoModal()">' +
'<div class="video-modal-box" onclick="event.stopPropagation()">' +
(open ? '<video src="' + S.videoModalUrl + '" controls autoplay playsinline></video>' : "") +
(S.videoModalCaption ? '<div class="video-modal-caption">' + escHtml(S.videoModalCaption) + "</div>" : "") +
'<button class="video-modal-close" onclick="closeVideoModal()">閉じる</button>' +
"</div></div>"
);
}
function render() {
pendingCharts = [];
var root = document.getElementById("root");
root.innerHTML =
'<div class="app-shell"><div class="container">' +
renderHeader() +
renderTabs() +
(S.tab === "record" ? renderRecordTab() : renderDashboardTab()) +
"</div></div>" +
renderVideoModal() +
renderGrabModal() +
renderEditGrabModal();
wireCharts();
}
function renderLoading() {
var root = document.getElementById("root");
root.innerHTML =
'<div class="app-shell"><div class="container">' +
renderHeader() +
'<div class="section" style="text-align:center;padding:40px 12px;color:' + COLORS.textFaint + ';">読み込み中…</div>' +
"</div></div>";
}
function loadAll() {
S.loading = true;
renderLoading();
refreshData().then(function () {
S.loading = false;
S.loadError = "";
render();
}).catch(function (err) {
S.loading = false;
S.loadError = "データの読み込みに失敗しました。通信状況を確認して、画面を再読み込みしてください。";
render();
});
}

document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") maybeResetDateToToday(); });
window.addEventListener("pageshow", function () { maybeResetDateToToday(); });
loadAll();
</script>
