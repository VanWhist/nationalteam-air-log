function readFileSlice(file, start, end) {

var reader = new FileReader();
reader.onload = function () {
var result = String(reader.result || "");
resolve(result.split(",")[1] || "");
};
reader.onerror = function () { reject(reader.error); };
reader.readAsDataURL(file.slice(start, end));
});

type: "videoUploadFinish",
sessionId: sessionId,
offset: offset,
chunkBase64: base64,
entryId: entryId,
rowId: rowId || "",
trickId: trickId,
videoType: type || "",
athleteId: athleteId || "",
athleteName: athleteName(athleteId) || "",
fileName: file.name || "video.mp4",
date: date || "",
trickLabel: trickLabel || "",

type: "videoUploadChunk",
sessionId: sessionId,
offset: offset,
chunkBase64: base64,
}).then(function (chunkRes) {
if (!chunkRes || chunkRes.status !== "ok") throw new Error("upload chunk failed");
offset += end - start;
if (onProgress) onProgress(Math.min(99, Math.round((offset / totalSize) * 100)));
return uploadNext(index + 1);

}

function getEntries(athleteId, category) {
return DATA.filter(function (e) { return e.athlete === athleteId && e.category === category; })

}
function rowTotal(r) { return r.reps !== undefined ? Number(r.reps) || 0 : (Number(r.success) || 0) + (Number(r.fail) || 0); }
function rowSuccess(r) {
if (r.reps === undefined) return Number(r.success) || 0; // 旧データ(reps列なし)はそのまま成功数を返す
if (r.result === "success") return Number(r.reps) || 0;
if (r.result === "fail") return 0;
return null; // ヨレ・未選択・トランポリンは成功率計算に含めない
}
function rowFail(r) {
if (r.reps === undefined) return Number(r.fail) || 0;
if (r.result === "fail") return Number(r.reps) || 0;
return 0;
}
function rowYure(r) {
if (r.reps === undefined) return 0; // 旧データにヨレの概念はない
if (r.result === "yure") return Number(r.reps) || 0;
return 0;
}
function entryTotal(entry) {
return entry.rows.reduce(function (sum, r) { return sum + rowTotal(r); }, 0);
}
function entrySuccess(entry) {
return entry.rows.reduce(function (sum, r) { var s = rowSuccess(r); return sum + (s === null ? 0 : s); }, 0);
}
/* 進入スピード別マップへの加算。技全体の集計にも、施設・台ごとの内訳にも同じロジックを使う。
   result === "" (未選択) は成功/失敗/ヨレのどれにも数えないが、分母(unselected)には加える
   ＝施設・台別カードの本数（rowTotalベース）と、ここでの合計本数を一致させるための扱い(コーチ確認済み)。 */
function addSpeedToMap(speedMap, r) {
if (!r.speedLevel) return;
if (!speedMap[r.speedLevel]) speedMap[r.speedLevel] = { success: 0, fail: 0, yure: 0, yureLow: 0, yureHigh: 0, unselected: 0 };
var sd = speedMap[r.speedLevel];
if (r.reps === undefined) {
// 旧データ(reps列なし)は成功/失敗の集計をそのまま使う
sd.success += Number(r.success) || 0;
sd.fail += Number(r.fail) || 0;
} else {
var repsForSpeed = Number(r.reps) || 0;
if (r.result === "success") {
sd.success += repsForSpeed;
} else if (r.result === "fail") {
sd.fail += repsForSpeed;
} else if (r.result === "yure") {
sd.yure += repsForSpeed;
var maxSeverity = (r.wobbleDetail || []).reduce(function (m, w) { return Math.max(m, Number(w.severity) || 0); }, 0);
if (maxSeverity >= 3) sd.yureHigh += repsForSpeed;
else if (maxSeverity >= 1) sd.yureLow += repsForSpeed;
} else {
sd.unselected += repsForSpeed;
}
}
}
function trickTotals(entries) {
var map = {};
entries.forEach(function (e) {
var facKey = e.facility ? (e.facility + "｜" + e.kicker) : null;
e.rows.forEach(function (r) {
var key = trickLabel(r.trickId) + (r.nuki ? tr("（抜き）") : "") + (r.unnatural ? tr("（アンナチュラル）") : "");
if (!map[key]) map[key] = { count: 0, success: 0, fail: 0, yure: 0, kakari: 0, speed: {}, lastDate: null, facilities: {} };
var s = rowSuccess(r), f = rowFail(r), y = rowYure(r), total = rowTotal(r);
map[key].count += total;
if (s !== null) map[key].success += s;
map[key].fail += f;
map[key].yure += y;
if (r.kakari) map[key].kakari += 1;
if (!map[key].lastDate || e.date > map[key].lastDate) map[key].lastDate = e.date;

/* ---- 施設・台別の技別本数(ウォータージャンプのみ) ---- */
function facilityKickerBreakdown(entries) {
var order = [];
var map = {};
entries.forEach(function (e) {
if (!e.facility) return;
if (!map[e.facility]) { map[e.facility] = {}; order.push(e.facility); }
if (!map[e.facility][e.kicker]) map[e.facility][e.kicker] = {};
var kMap = map[e.facility][e.kicker];
e.rows.forEach(function (r) {
var key = trickLabel(r.trickId) + (r.nuki ? tr("（抜き）") : "") + (r.unnatural ? tr("（アンナチュラル）") : "");
if (!kMap[key]) kMap[key] = { count: 0, success: 0 };
kMap[key].count += rowTotal(r);
kMap[key].success += rowSuccess(r) || 0;
});
});
return { order: order, map: map };
}
function sumTrickCounts(tricks) {
return Object.keys(tricks).reduce(function (sum, k) { return { count: sum.count + tricks[k].count, success: sum.success + tricks[k].success }; }, { count: 0, success: 0 });
}
function renderFacilityBreakdown(entries) {
var b = facilityKickerBreakdown(entries);
if (b.order.length === 0) return "";
var grandCount = 0;
var grandSuccess = 0;
var facilitiesHtml = b.order.map(function (fname) {
var kickers = b.map[fname];
var canonical = kickersForFacility(fname);
var kickerOrder = Object.keys(kickers).sort(function (a, c) {
var ia = canonical.indexOf(a); if (ia === -1) ia = 999;
var ic = canonical.indexOf(c); if (ic === -1) ic = 999;
return ia - ic;
});
var facilityCount = 0;
var facilitySuccess = 0;
var kickersHtml = kickerOrder.map(function (kname) {
var tricks = kickers[kname];
var kickerTotal = sumTrickCounts(tricks);
facilityCount += kickerTotal.count;
facilitySuccess += kickerTotal.success;
var trickKeys = Object.keys(tricks).sort(function (a, c) { return tricks[c].count - tricks[a].count; });
var kRate = kickerTotal.count > 0 ? Math.round((kickerTotal.success / kickerTotal.count) * 100) : 0;
var chips = trickKeys.map(function (tk) {
var t = tricks[tk];
var tRate = t.count > 0 ? Math.round((t.success / t.count) * 100) : 0;
return '<span class="recent-tech-chip">' + escHtml(tk) + " " + t.success + "/" + t.count + tr("本・") + tRate + "%</span>";
}).join("");
return '<div style="margin-top:8px;"><div style="font-size:11px;color:' + COLORS.textFaint + ';margin-bottom:4px;display:flex;justify-content:space-between;"><span>' + escHtml(tr(kname)) + '</span><span style="color:' + COLORS.ice + ';font-family:ui-monospace,monospace;">' + kickerTotal.success + "/" + kickerTotal.count + tr("本・") + kRate + '%</span></div><div class="recent-techs">' + chips + "</div></div>";
}).join("");
grandCount += facilityCount;
grandSuccess += facilitySuccess;
var fRate = facilityCount > 0 ? Math.round((facilitySuccess / facilityCount) * 100) : 0;
return '<div style="margin-bottom:14px;"><div style="font-size:13px;font-weight:600;display:flex;justify-content:space-between;"><span>' + escHtml(tr(fname)) + '</span><span style="color:' + COLORS.ice + ';font-family:ui-monospace,monospace;">' + tr("累計 ") + facilitySuccess + "/" + facilityCount + tr("本・") + fRate + '%</span></div>' + kickersHtml + "</div>";
}).join("");
var gRate = grandCount > 0 ? Math.round((grandSuccess / grandCount) * 100) : 0;
return '<div class="card"><div class="recent-title" style="display:flex;justify-content:space-between;"><span>' + tr("施設・台別 技別本数") + '</span><span>' + tr("総本数 ") + grandSuccess + "/" + grandCount + tr("本・") + gRate + "%</span></div>" + facilitiesHtml + "</div>";
}

function startEditEntry(entryId) {

note: e.note || "",
rows: e.rows.reduce(function (acc, r) {
var grabCategory = r.modifier === "position" ? "position" : (r.modifier === "G" || r.modifier === "g" ? "grab" : "none");
function makeRow(rowId, reps, result) {
return {
rowId: rowId,
trickId: r.trickId,
modifier: r.modifier,
grabCategory: grabCategory,
grabType: grabCategory === "grab" ? (r.grabType || "other") : null,

};

   そのまま1行に詰め込むと本数欄が空(0本相当)になってしまっていた(実際に発生した不具合)。
   ここで成功行・失敗行の最大2行に分けることで、元のデータを失わずに編集できるようにする。 */
var succ = Number(r.success) || 0;
var fai = Number(r.fail) || 0;
if (succ > 0) acc.push(makeRow(genRowId(), succ, "success"));
if (fai > 0) acc.push(makeRow(genRowId(), fai, "fail"));
if (succ === 0 && fai === 0) acc.push(makeRow(r.rowId || genRowId(), 0, ""));
} else {
acc.push(makeRow(r.rowId || genRowId(), r.reps, r.result || ""));
}
return acc;
}, []),
};

}

この画面で決めるので、城さんが誰のパスワードも知らない状態を保てる。 */
var AUTH_UI = {
  screen: "", busy: false, error: "", info: "",
  email: "", pw: "", pw2: "", setupInfo: null, inviteInfo: null, blockedCode: ""
};

function authScreenActive() { return !!AUTH_UI.screen; }

/* 送信中に押しっぱなしで二重に飛ばないよう、必ずbusyで塞ぐ。 */
function authPost(payload, onOk) {
if (AUTH_UI.busy) return;
AUTH_UI.busy = true;
AUTH_UI.error = "";
render();
payload.lang = LANG;   /* サーバ側がメールの言語を決めるのに使う */
apiPost(payload).then(function (res) {
AUTH_UI.busy = false;
if (!res || res.status !== "ok") {
AUTH_UI.error = (res && res.message) || tr("うまくいきませんでした。通信状況を確認してもう一度お試しください。");
render();
return;
}
onOk(res);
}).catch(function () {
AUTH_UI.busy = false;
AUTH_UI.error = tr("通信に失敗しました。電波の良い場所でもう一度お試しください。");
render();
});
}

/* アドレスバーから ?invite= と ?reset= だけを取り除く。
初回設定を終えた直後に「ホーム画面に追加」すると、招待リンクのURLがアイコンに焼き付く。
招待は1回きりなので、次に起動したときは毎回「このリンクは有効ではありません」になる。
設定が済んだ時点でURLを綺麗にしておけば、そのあと追加したアイコンは普通にアプリが開く。
?token= は選手の個人リンクなので消さない。 */
function stripAuthParamsFromUrl() {
try {
if (!window.history || !history.replaceState) return;
if (!INVITE_TOKEN && !RESET_TOKEN) return;
var kept = [];
location.search.replace(/^\?/, "").split("&").forEach(function (kv) {
if (!kv) return;
var k = kv.split("=")[0];
if (k === "invite" || k === "reset") return;
kept.push(kv);
});
history.replaceState(null, "", location.pathname + (kept.length ? "?" + kept.join("&") : "") + location.hash);
} catch (e) {}
}

/* ログイン成功後は、前の利用者のキャッシュが画面に残らないよう必ず読み直す。 */
function authAdoptSession(res) {
clearAllCaches();
stripAuthParamsFromUrl();
saveAuth({
token: res.token || "", role: res.role, athleteId: res.athleteId || "",
displayName: res.displayName || "", staffRole: res.staffRole || "", email: res.email || ""
});
AUTH_UI.screen = "";
AUTH_UI.pw = "";
AUTH_UI.pw2 = "";
ATHLETES = []; DATA = []; VIDEOS = [];
IS_SCOPED = false; SERVER_LOAD_OK = false;
S.athlete = ""; S.dashAthlete = ""; S.fatalCode = "";
S.loading = true;
renderLoading();
refreshDataWithRetry(3, 1500).then(function () {
S.loading = false; S.loadError = ""; render();
}).catch(function () {
S.loading = false;
S.loadError = tr("データの読み込みに失敗しました。通信状況を確認して、画面を再読み込みしてください。");
render();
});
}

'<button class="save-btn" onclick="doInviteSetup()" ' + (busy ? "disabled" : "") + ">" + (busy ? tr("設定中…") : tr("設定する")) + "</button>";
}

} else if (AUTH_UI.screen === "setup") {
var name = (AUTH_UI.setupInfo && AUTH_UI.setupInfo.athleteName) || "";
body =
'<div style="font-size:15px;font-weight:600;">' + tr("初回設定") + (name ? "（" + escHtml(name) + "）" : "") + "</div>" +
authNoticeHtml() +
'<div class="sub-label">' + tr("次からはリンクが無くても、メールアドレスとパスワードで入れるようになります。") + "</div>" +
authFieldHtml("メールアドレス", "email", "email", AUTH_UI.email, "you@example.com") +
authFieldHtml("パスワード（10文字以上）", "password", "pw", AUTH_UI.pw) +
authFieldHtml("パスワード（確認用）", "password", "pw2", AUTH_UI.pw2) +
'<button class="save-btn" onclick="doSetup()" ' + (busy ? "disabled" : "") + ">" + (busy ? tr("設定中…") : tr("設定する")) + "</button>" +
'<button class="chip-btn" onclick="closeAuthScreen()" ' + (busy ? "disabled" : "") + ">" + tr("あとで設定する") + "</button>";

} else if (AUTH_UI.screen === "reset") {
body =
'<div style="font-size:15px;font-weight:600;">' + tr("新しいパスワードの設定") + "</div>" +
authNoticeHtml() +
authFieldHtml("新しいパスワード（10文字以上）", "password", "pw", AUTH_UI.pw) +
authFieldHtml("新しいパスワード（確認用）", "password", "pw2", AUTH_UI.pw2) +
'<button class="save-btn" onclick="doResetPassword()" ' + (busy ? "disabled" : "") + ">" + (busy ? tr("設定中…") : tr("設定する")) + "</button>";

} else if (AUTH_UI.screen === "forgot") {
body =
'<div style="font-size:15px;font-weight:600;">' + tr("パスワードの再設定") + "</div>" +
'<div class="sub-label">' + tr("登録済みのメールアドレスに、再設定用のリンクをお送りします。リンクは30分間・1回だけ有効です。") + "</div>" +
authFieldHtml("メールアドレス", "email", "email", AUTH_UI.email, "you@example.com") +
'<button class="save-btn" onclick="doRequestReset()" ' + (busy ? "disabled" : "") + ">" + (busy ? tr("送信中…") : tr("再設定リンクを送る")) + "</button>" +
'<button class="chip-btn" onclick="showAuthScreen(\'login\')" ' + (busy ? "disabled" : "") + ">" + tr("ログイン画面に戻る") + "</button>";

} else if (AUTH_UI.screen === "blocked") {
/* リンクが切れた・コピーミスした人に、次に何をすればいいかを必ず書く。
真っ白な画面やJSONのエラーで終わらせない。 */
body =
'<div style="font-size:15px;font-weight:600;">' +
(AUTH_UI.blockedCode === "login_required" ? tr("ログインが必要です") : tr("このリンクは有効ではありません")) + "</div>" +
'<div class="sub-label">' +
(AUTH_UI.blockedCode === "login_required"
? tr("メールアドレスとパスワードでログインしてください。")
: tr("リンクが途中で切れているか、古くなっている可能性があります。メールアドレスとパスワードを設定済みの方は、下からログインできます。")) +
"</div>" +
'<div class="draft-banner" style="margin-top:4px;">' + tr("設定がお済みでない方や、うまくいかない場合は城さんにご連絡ください。") + "</div>" +
'<button class="save-btn" onclick="showAuthScreen(\'login\')">' + tr("ログイン") + "</button>";

} else {
body =
'<div style="font-size:15px;font-weight:600;">' + tr("ログイン") + "</div>" +
authFieldHtml("メールアドレス", "email", "email", AUTH_UI.email, "you@example.com") +
authFieldHtml("パスワード", "password", "pw", AUTH_UI.pw) +
'<button class="save-btn" onclick="doLogin()" ' + (busy ? "disabled" : "") + ">" + (busy ? tr("確認中…") : tr("ログイン")) + "</button>" +
'<button class="chip-btn" onclick="showAuthScreen(\'forgot\')" ' + (busy ? "disabled" : "") + ">" + tr("パスワードをお忘れの方") + "</button>" +
(AUTH || INVITE_TOKEN || RESET_TOKEN || S.fatalCode ? "" :
'<button class="chip-btn" onclick="closeAuthScreen()" ' + (busy ? "disabled" : "") + ">" + tr("閉じる") + "</button>");
}

document.getElementById("root").innerHTML =
'<div class="app-shell"><div class="container">' +
'<div class="header-row"><div><h1 class="app-title">NTエアlog</h1></div>' +
'<div style="display:flex;align-items:center;gap:8px;">' + renderLangToggle() + '<img class="app-logo" src="assets/logo.png" alt="JMT" /></div></div>' +
mogulDividerSvg() +
'<div class="card" style="display:flex;flex-direction:column;gap:10px;margin-top:8px;">' +
(AUTH_UI.info ? '<div class="draft-banner" style="border-color:' + COLORS.ice + ';">' + escHtml(AUTH_UI.info) + "</div>" : "") +
(AUTH_UI.error ? '<div class="draft-banner" style="border-color:' + COLORS.amber + ';color:' + COLORS.amber + ';">' + escHtml(AUTH_UI.error) + "</div>" : "") +
body +
"</div></div></div>";
}

/* ヘッダーに出す、今誰として使っているかの表示とログアウト。
共用のパソコンで開いてしまったとき、端末を人に譲るときのために必要。 */
function renderAuthBarHtml() {
if (AUTH) {
var who = AUTH.displayName || AUTH.email || "";
var suffix = AUTH.staffRole ? "（" + tr(AUTH.staffRole) + "）" : (AUTH.role === "staff" ? "（" + tr("スタッフ") + "）" : "");
return (
'<div style="display:flex;align-items:center;justify-content:flex-end;gap:10px;margin:6px 0 -4px;font-size:11px;color:' + COLORS.textFaint + ';">' +
"<span>" + escHtml(who) + escHtml(suffix) + "</span>" +
'<button style="background:none;border:none;color:' + COLORS.textFaint + ';font-size:11px;text-decoration:underline;cursor:pointer;padding:4px 0;" onclick="doLogout()">' + tr("ログアウト") + "</button>" +
"</div>"
);
}
/* 個人リンク(?token=)で開いている選手には「ログイン」を出さない。
本人はもう特定できているので、出すと「ログインしないと使えない」と誤解させる。
設定をすすめる案内は renderSetupBannerHtml() のバナーが担当する。 */
if (URL_TOKEN) return "";
return (
'<div style="text-align:right;margin:6px 0 -4px;">' +
'<button style="background:none;border:none;color:' + COLORS.textFaint + ';font-size:11px;text-decoration:underline;cursor:pointer;padding:4px 0;" onclick="showAuthScreen(\'login\')">' + tr("ログイン") + "</button>" +
"</div>"
);
}

/* 招待リンクを開いたとき、誰への招待かをサーバに聞いて画面に出す。 */
function loadInviteInfo() {
apiPost({ type: "authInviteInfo", inviteToken: INVITE_TOKEN }).then(function (res) {
if (!res || res.status !== "ok") {
/* 既にログイン済みの人が、使用済みの招待リンク(ホーム画面のアイコンなど)から
開いた場合は、行き止まりの画面を出さずに普通のアプリとして開く。 */
if (AUTH) {
stripAuthParamsFromUrl();
INVITE_TOKEN = "";
AUTH_UI.screen = "";
AUTH_UI.error = "";
loadAll();
return;
}
AUTH_UI.blockedCode = "invite_invalid";
AUTH_UI.error = (res && res.message) || "";
showAuthScreen("blocked");
return;
}
AUTH_UI.inviteInfo = res;
if (res.lang === "en" || res.lang === "ja") setLangSilently(res.lang);
render();
}).catch(function () {
AUTH_UI.error = tr("通信に失敗しました。電波の良い場所でもう一度お試しください。");
render();
});
}
/* 招待された人の登録言語に画面を合わせる。保存はするが再描画は呼び出し側に任せる。 */
function setLangSilently(lang) {
LANG = lang;
try { localStorage.setItem(LANG_STORAGE_KEY, lang); } catch (e) {}
document.documentElement.lang = lang;
}

/* 個人リンクで開いた選手がまだアカウントを作っていなければ、初回設定を案内する。
ログイン済みの端末では呼ばないので、設定が済んだ人に毎回出ることはない。 */
function checkFirstTimeSetup() {
if (AUTH || !URL_TOKEN || RESET_TOKEN || INVITE_TOKEN) return;
apiPost({ type: "authStatus", token: URL_TOKEN }).then(function (res) {
if (!res || res.status !== "ok" || !res.known || res.hasAccount) return;
AUTH_UI.setupInfo = res;
/* 全画面の設定画面で覆わない。第2段階は「今までどおり記録できる」のが前提なので、
アプリはそのまま出したうえで、消せる案内バナーだけを出す。
全画面で出すと、個人リンクを開いた選手に「ログインしないと使えない」と読まれてしまう。 */
if (!authScreenActive()) render();
}).catch(function () { /* 判定できなくても従来どおり使えるので黙って諦める */ });
}

/* 初回設定のおすすめバナー。閉じてもその場限りで、次に開いたらまた出る。
「まだの人に気づいてもらう」ことと「今すぐやらなくても困らない」ことを両立させる。 */
function dismissSetupBanner() { S.setupBannerClosed = true; render(); }
function openSetupScreen() { showAuthScreen("setup"); }
function renderSetupBannerHtml() {
if (AUTH || !AUTH_UI.setupInfo || S.setupBannerClosed || authScreenActive()) return "";
return (
'<div class="card" style="margin-top:8px;border-color:' + COLORS.ice + ';display:flex;flex-direction:column;gap:8px;">' +
'<div style="font-size:13px;">' + tr("メールアドレスとパスワードを設定しておくと、次からリンクが無くても入れます。今すぐでなくても、これまでどおり記録できます。") + "</div>" +
'<div class="inline-row">' +
'<button class="save-btn" style="flex:1;" onclick="openSetupScreen()">' + tr("設定する") + "</button>" +
'<button class="chip-btn" style="flex:0 0 auto;padding:12px 14px;" onclick="dismissSetupBanner()">' + tr("あとで") + "</button>" +
"</div></div>"
);
}

/* 分析シート用のエントリ。ダッシュボード本体と同じ期間フィルタを使う。 */
function dashAnalyzeEntries() {
var raw = getEntries(S.dashAthlete, S.dashCategory);
return S.dashPeriod === "all" ? raw : raw.filter(function (fe) { return isInDashPeriod(fe.date, S.dashPeriod); });
}
function analyzeLegendYureHtml() {
return '<div style="display:flex;gap:10px;flex-wrap:wrap;font-size:9.5px;color:' + COLORS.textFaint + ';margin:2px 0 7px;">' +
'<span style="display:inline-flex;align-items:center;gap:3px;"><span style="width:8px;height:8px;border-radius:2px;display:inline-block;background:#FFD1A3;"></span>' + tr("浅め(1〜2)") + "</span>" +
'<span style="display:inline-flex;align-items:center;gap:3px;"><span style="width:8px;height:8px;border-radius:2px;display:inline-block;background:#FF7A18;"></span>' + tr("深め(3〜5)") + "</span>" +
"</div>";
}
function renderTrickAnalyzeSheet() {
var key = S.dashAnalyzeTrick;
var open = !!key && S.dashAthlete !== "team" && S.dashCategory === "water";
var inner = "";
if (open) {
var entries = dashAnalyzeEntries();
var head = trickHeadTotals(entries, key);
var vars = grabVariantTotals(entries, key);
var tags = wobbleTagTotals(entries, key);
var maxV = vars.reduce(function (m, v) { return Math.max(m, v.count); }, 1);
var maxT = tags.reduce(function (m, t) { return Math.max(m, t.count); }, 1);

var subLine = head.count > 0
? (escHtml(athleteName(S.dashAthlete)) + " ・ " + escHtml(dashPeriodLabel(S.dashPeriod)) + " ／ " + head.count + tr("本") + " ・ " + rankCountLabel(head))
: escHtml(tr("この期間の記録がありません。"));

var varsHtml = vars.length ? vars.map(function (v) {
var pct = v.count > 0 ? Math.max(Math.round((v.count / maxV) * 100), 3) : 0;
var numLabel = v.count > 0
? (rankCountLabel(v) + " " + v.count + tr("本"))
: (tr("本数の入力なし") + " " + tr("({n}件)", { n: v.rows }));
return '<div class="av-row"><span class="av-name">' + escHtml(grabVariantLabel(v)) + '</span>' +
'<div class="av-bar">' + rankSegBarHtml(v, pct) + "</div>" +
'<span class="av-num">' + escHtml(numLabel) + "</span></div>";
}).join("") : ('<div class="analyze-empty">' + escHtml(tr("この期間の記録がありません。")) + "</div>");

var tagsHtml = tags.length ? tags.map(function (t) {
var pct = Math.max(Math.round((t.count / maxT) * 100), 3);
var lowPct = t.count > 0 ? (t.low / t.count) * 100 : 0;
var highPct = t.count > 0 ? (t.high / t.count) * 100 : 0;
var unkPct = t.count > 0 ? (t.unknown / t.count) * 100 : 0;
return '<div class="av-row"><span class="av-name">' + escHtml(tr(t.tag)) + '</span>' +
'<div class="av-bar"><div style="width:' + pct + '%;height:100%;display:flex;">' +
'<div style="width:' + lowPct + '%;background:#FFD1A3;"></div>' +
'<div style="width:' + highPct + '%;background:#FF7A18;"></div>' +
'<div style="width:' + unkPct + '%;background:#3A4B60;"></div>' +
"</div></div>" +
'<span class="av-num">' + escHtml(tr("{n}回", { n: t.count })) + ' <span class="av-muted">' + escHtml(tr("(浅{low} / 深{high})", { low: t.low, high: t.high })) + "</span></span></div>";
}).join("") : ('<div class="analyze-empty">' + escHtml(tr("この技には、結果が「ヨレ」の記録がまだありません。")) + "</div>");

inner =
'<div class="analyze-header"><span>' + escHtml(key) + escHtml(tr("｜分析")) + '</span><button type="button" class="grab-modal-close" onclick="closeTrickAnalyze()">' + tr("閉じる") + "</button></div>" +
'<div class="analyze-sub">' + subLine + "</div>" +
'<div class="analyze-sec-title">' + tr("グラブ・ポジション別") + "</div>" +
'<div class="analyze-note">' + escHtml(tr("どの組み合わせが安定しているか。実際に記録がある組み合わせだけを本数順に表示します。")) + "<br>" + escHtml(tr("「（未選択）」はニア/レギュラーを入力していない記録です。")) + "</div>" +
speedLegendHtml() +
varsHtml +
'<div class="analyze-divider"></div>' +
'<div class="analyze-sec-title">' + tr("ヨレの傾向（タグ別）") + "</div>" +
'<div class="analyze-note">' + tr("単位は<b>回数</b>＝そのタグを付けた記録の数です。<b>本数とは別の単位</b>で、率や平均は出していません。") + "<br>" + escHtml(tr("結果が「ヨレ」の記録だけを数えています。")) + "</div>" +
analyzeLegendYureHtml() +
tagsHtml;
}
return '<div class="analyze-overlay' + (open ? " open" : "") + '" onclick="closeTrickAnalyze()">' +
'<div class="analyze-sheet" onclick="event.stopPropagation()">' + inner + "</div></div>";
}

function render() {
if (S.fatalCode && !authScreenActive()) { AUTH_UI.screen = "blocked"; }
if (authScreenActive()) { renderAuthScreen(); return; }
pendingCharts = [];
var root = document.getElementById("root");
root.innerHTML =
'<div class="app-shell"><div class="container">' +
renderHeader() +
renderTabs() +
(S.tab === "record" ? renderRecordTab() : renderDashboardTab()) +
"</div></div>" +
renderVideoModal() +
renderGrabModal() +
renderEditGrabModal() +
renderTrickAnalyzeSheet();
wireCharts();
}
function renderLoading() {
var root = document.getElementById("root");
root.innerHTML =
'<div class="app-shell"><div class="container">' +
renderHeader() +
'<div class="section" style="text-align:center;padding:40px 12px;color:' + COLORS.textFaint + ';">' + tr("読み込み中…") + '</div>' +
"</div></div>";
}
/* 裏で最新データを取り終えたときに、その場で描き直してよいかを判定する。
入力中のテキスト欄にフォーカスがある/編集モーダルを開いている最中に innerHTML を
作り直すと、入力中の文字やカーソル位置が飛んでしまうため、その場合は描き直しを見送る。
(グローバル変数は既に最新に差し替わっているので、次に何か操作した時点で反映される) */
function safeToRerender() {
if (S.editingEntryId) return false;
try {
var el = document.activeElement;
if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return false;
} catch (e) {}
return true;
}
function loadAll() {
/* 再設定メールや招待リンクから開いた場合は、データを読みに行かずその画面だけを出す。 */
if (RESET_TOKEN) { showAuthScreen("reset"); return; }
if (INVITE_TOKEN) { showAuthScreen("invite"); loadInviteInfo(); return; }
checkFirstTimeSetup();
var cached = loadCache();
var usedCache = false;
if (cached) {
try {
applyData(cached);
S.loading = false;
S.refreshing = true; /* ⟳が回って「裏で更新中」だと分かるようにする */
usedCache = true;
render();
} catch (e) { usedCache = false; }
}
if (!usedCache) {
S.loading = true;
renderLoading();
}
refreshDataWithRetry(3, 1500).then(function () {
S.loading = false;
S.refreshing = false;
S.loadError = "";
S.refreshError = "";
if (safeToRerender()) render();
}).catch(function (err) {
S.loading = false;
S.refreshing = false;
if (usedCache) {
/* 前回のデータを出したまま黙って古いものを見せ続けるのが一番危ないので、
「これは最新ではない」と明示する。 */
S.refreshError = tr("最新データを取得できませんでした。表示は前回開いたときの内容です。");
} else {
S.loadError = tr("データの読み込みに失敗しました。通信状況を確認して、画面を再読み込みしてください。");
}
if (safeToRerender()) render();
});
}

document.documentElement.lang = LANG;
document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") maybeResetDateToToday(); });
window.addEventListener("pageshow", function () { maybeResetDateToToday(); });
loadAll();
</script>
</body>
